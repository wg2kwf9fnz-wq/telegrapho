name: Publish Telegrapho release image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source branch or commit to build
        required: true
        default: upstream/contribution
        type: string
      release_tag:
        description: Immutable release tag for the image
        required: true
        default: 1.0.1-patch.1
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-patch\.[0-9]+$ ]]; then
            echo "Release tag must look like 1.0.1-patch.1" >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wg2kwf9fnz-wq/telegrapho:${{ inputs.release_tag }}
          provenance: false

      - name: Record image provenance and digest
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          {
            echo "### Telegrapho release image"
            echo
            echo "- Source ref: `$SOURCE_REF`"
            echo "- Source commit: `$SOURCE_SHA`"
            echo "- Image: `ghcr.io/wg2kwf9fnz-wq/telegrapho:$RELEASE_TAG`"
            echo "- Digest: `$IMAGE_DIGEST`"
            echo "- Platforms: `linux/amd64`, `linux/arm64`"
          } >> "$GITHUB_STEP_SUMMARY"
