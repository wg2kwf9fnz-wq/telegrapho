name: Publish Telegrapho Umbrel release image

on:
  push:
    branches:
      - release/telegrapho-1.0.1-patch.1

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish multi-architecture image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wg2kwf9fnz-wq/telegrapho:1.0.1-patch.1
          provenance: false

      - name: Record source commit and image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          {
            echo "### Telegrapho Umbrel release image"
            echo
            echo "- Source ref: `release/telegrapho-1.0.1-patch.1`"
            echo "- Source commit: `$SOURCE_SHA`"
            echo "- Image: `ghcr.io/wg2kwf9fnz-wq/telegrapho:1.0.1-patch.1`"
            echo "- Digest: `$IMAGE_DIGEST`"
            echo "- Platforms: `linux/amd64`, `linux/arm64`"
          } >> "$GITHUB_STEP_SUMMARY"
